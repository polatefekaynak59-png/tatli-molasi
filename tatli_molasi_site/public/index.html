
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6f3d2e">
  <meta name="description" content="Tatlı Molası konum paylaşım sitesi">
  <title>Tatlı Molası</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <main class="container">
    <h1>🍰 Tatlı Molası</h1>

    <p>
      Konumunu haritada göstermek için aşağıdaki butona bas.
      Konumun yalnızca izin verdiğinde paylaşılır.
    </p>

    <button id="location-button" type="button">
      Konumumu Kullan
    </button>

    <p id="location-status" role="status" aria-live="polite">
      Konum paylaşmak için butona bas.
    </p>

    <div id="map" style="height: 400px; width: 100%;"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
